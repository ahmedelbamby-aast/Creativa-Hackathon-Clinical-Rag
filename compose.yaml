services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: creativa
      POSTGRES_PASSWORD: creativa-local
      POSTGRES_DB: creativa_diabetes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativa -d creativa_diabetes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: