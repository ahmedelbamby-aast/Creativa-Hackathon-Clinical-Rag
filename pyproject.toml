[project]
name = "creativa-diabetes"
version = "0.1.0"
description = "Bilingual diabetes RAG assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-genai>=1.0.0",
    "gradio>=4.40.0",
    "langdetect>=1.0.9",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0,<8",
    "pytest-instafail>=0.5,<1",
    "pytest-randomly>=4.0,<5",
    "pytest-timeout>=2.4,<3",
    "pytest-tldr>=0.2.6,<1",
    "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-n=4",
    "--dist=loadscope",
    "--instafail",
    "--timeout=30",
    "--timeout-method=thread",
    "--strict-config",
    "--strict-markers",
    "--cov=chunking",
    "--cov=example/services/security",
    "--cov=src",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=75",
]
markers = [
    "integration: exercises multiple pipeline components together",
]

[tool.coverage.run]
branch = true
parallel = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
