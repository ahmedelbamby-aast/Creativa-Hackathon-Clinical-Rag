[project]
name = "creativa-diabetes"
version = "0.1.0"
description = "Bilingual diabetes RAG assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "gradio>=4.40.0",
    "langdetect>=1.0.9",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
